<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Natthachai Panyana — robotics, IoT and AI projects" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="85%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#30363D"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="70%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <style>
    .name{font:700 58px Inter, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#fff;letter-spacing:-1.5px}
    .sub{font:400 22px Inter, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9CA3AF}
    .role{font:500 26px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#22D3EE}
    .r1{animation:r1 9s infinite}
    .r2{opacity:0;animation:r2 9s infinite}
    .r3{opacity:0;animation:r3 9s infinite}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes r1{0%,28%{opacity:1;transform:translateY(0)}33%,95%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes r2{0%,30%{opacity:0;transform:translateY(8px)}35%,61%{opacity:1;transform:translateY(0)}66%,100%{opacity:0;transform:translateY(-8px)}}
    @keyframes r3{0%,63%{opacity:0;transform:translateY(8px)}68%,94%{opacity:1;transform:translateY(0)}99%,100%{opacity:0;transform:translateY(-8px)}}
    @keyframes blink{50%{opacity:0}}
    .ring{fill:none;stroke:#22D3EE;stroke-width:1.5;transform-origin:1010px 160px;animation:pulse 4s ease-out infinite;opacity:0}
    .ring.b{animation-delay:1.3s}.ring.c{animation-delay:2.6s}
    @keyframes pulse{0%{opacity:.7;transform:scale(.2)}100%{opacity:0;transform:scale(1)}}
    .sweep{transform-origin:1010px 160px;animation:spin 6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <rect width="1200" height="320" fill="#0D1117"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <!-- radar motif (LiDAR) -->
  <g>
    <circle cx="1010" cy="160" r="120" fill="none" stroke="#30363D" stroke-width="1"/>
    <circle cx="1010" cy="160" r="80" fill="none" stroke="#30363D" stroke-width="1"/>
    <circle cx="1010" cy="160" r="40" fill="none" stroke="#30363D" stroke-width="1"/>
    <line x1="890" y1="160" x2="1130" y2="160" stroke="#30363D"/>
    <line x1="1010" y1="40" x2="1010" y2="280" stroke="#30363D"/>
    <circle class="ring" cx="1010" cy="160" r="120"/>
    <circle class="ring b" cx="1010" cy="160" r="120"/>
    <circle class="ring c" cx="1010" cy="160" r="120"/>
    <g class="sweep"><path d="M1010 160 L1130 160 A120 120 0 0 0 1095 75 Z" fill="#22D3EE" fill-opacity="0.18"/></g>
    <circle cx="1068" cy="118" r="5" fill="#22D3EE"/>
    <circle cx="950" cy="205" r="4" fill="#22D3EE" fill-opacity="0.7"/>
    <circle cx="1010" cy="160" r="4" fill="#fff"/>
  </g>
  <rect x="72" y="70" width="64" height="5" fill="#22D3EE"/>
  <text class="name" x="72" y="150">Natthachai Panyana</text>
  <text class="sub" x="72" y="192">Applied Computer Science · KMUTT</text>
  <g transform="translate(72 250)">
    <text class="role r1">&gt; robots that find plants and feed them</text>
    <text class="role r2">&gt; IoT sensors for compost piles</text>
    <text class="role r3">&gt; solving problems in Python with AI tools</text>
  </g>
  <rect y="240" width="1200" height="80" fill="url(#fade)"/>
</svg>
