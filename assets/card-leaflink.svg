<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" width="580" height="210" role="img" aria-label="LeafLink — IoT sensors inside a compost pile" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font:700 28px Inter, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#fff}
    .s{font:400 16px Inter, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9CA3AF}
    .pill{fill:#0D1117;stroke:#22D3EE;stroke-opacity:.5}
    .pt{font:500 13px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#22D3EE}
    .go{font:500 14px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#9CA3AF}
  </style>
  <rect x="1" y="1" width="578" height="208" rx="14" fill="#161B22" stroke="#30363D"/>
  <rect x="1" y="1" width="6" height="208" rx="3" fill="#22D3EE"/>
  <text class="t" x="34" y="56">LeafLink</text>
  <text class="s" x="34" y="86">IoT sensors inside a compost pile</text>
