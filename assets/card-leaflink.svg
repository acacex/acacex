  <g transform="translate(470 120)" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"><circle r="5" fill="#22D3EE" stroke="none"/><path d="M-16 -16 A22 22 0 0 1 16 -16" stroke-opacity=".9"/><path d="M-30 -30 A42 42 0 0 1 30 -30" stroke-opacity=".55"/><path d="M-44 -44 A62 62 0 0 1 44 -44" stroke-opacity=".28"/></g>
