<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" width="580" height="210" role="img" aria-label="GrowMate — A robot that finds plants with a 2D LiDAR" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t{font:700 28px Inter, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#fff}
    .s{font:400 16px Inter, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9CA3AF}
    .pill{fill:#0D1117;stroke:#22D3EE;stroke-opacity:.5}
    .pt{font:500 13px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#22D3EE}
    .go{font:500 14px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#9CA3AF}
  </style>
  <rect x="1" y="1" width="578" height="208" rx="14" fill="#161B22" stroke="#30363D"/>
  <rect x="1" y="1" width="6" height="208" rx="3" fill="#22D3EE"/>
  <text class="t" x="34" y="56">GrowMate</text>
  <text class="s" x="34" y="86">A robot that finds plants with a 2D LiDAR</text>
  <text class="s" x="34" y="108">and drops fertilizer at their base.</text>
  <g transform="translate(34 138)">
    <rect class="pill" width="90" height="28" rx="14"/><text class="pt" x="14" y="19">Arduino</text>
    <rect class="pill" x="100" width="100" height="28" rx="14"/><text class="pt" x="114" y="19">2D LiDAR</text>
  </g>
  <text class="go" x="34" y="192">view project →</text>
  <g transform="translate(470 100)" fill="none" stroke="#22D3EE"><circle r="14" stroke-opacity=".9"/><circle r="30" stroke-opacity=".5"/><circle r="46" stroke-opacity=".25"/><circle cx="26" cy="-22" r="4" fill="#22D3EE" stroke="none"/><circle cx="-30" cy="18" r="3" fill="#22D3EE" fill-opacity=".7" stroke="none"/></g>
</svg>
