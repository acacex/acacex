<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130" role="img" aria-labelledby="t">
  <title id="t">2 gold medals, 1 runner-up award, 8 competitions and events, 3 projects</title>
  <style>
    .f { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .num { font-size: 40px; font-weight: 700; fill: #FFFFFF; }
    .lab { font-size: 15px; fill: #D0D0D0; }
    .tile { fill: #111111; stroke: #353535; stroke-width: 2; }
    .in { opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; } .d4 { animation-delay: .7s; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .glow { animation: glow 3.2s ease-in-out infinite; }
    @keyframes glow { 0%,100% { stroke: #353535; } 50% { stroke: #FFFFFF; } }
    .g2 { animation-delay: .8s; } .g3 { animation-delay: 1.6s; } .g4 { animation-delay: 2.4s; }
  </style>
  <defs>
    <g id="medal">
      <path d="M-9 -26 L-3 -10 L3 -10 L9 -26 Z" fill="#FFFFFF" opacity=".8"/>
      <circle r="12" cy="2"/>
      <circle r="7" cy="2" fill="none" stroke="#111111" stroke-width="2" opacity=".35"/>
    </g>
  </defs>
  <g class="f">
    <g class="in d1">
      <rect class="tile glow" x="1" y="1" width="213" height="128" rx="14"/>
      <use href="#medal" x="74" y="54" fill="#FFFFFF"/>
      <text class="num" x="102" y="68">2</text>
      <text class="lab" x="107" y="104" text-anchor="middle">gold medals</text>
    </g>
    <g class="in d2">
      <rect class="tile glow g2" x="229" y="1" width="213" height="128" rx="14"/>
      <use href="#medal" x="302" y="54" fill="#D0D0D0"/>
      <text class="num" x="330" y="68">1</text>
      <text class="lab" x="335" y="104" text-anchor="middle">1st runner-up award</text>
    </g>
    <g class="in d3">
      <rect class="tile glow g3" x="457" y="1" width="213" height="128" rx="14"/>
      <text class="num" x="563" y="68" text-anchor="middle">8</text>
      <text class="lab" x="563" y="104" text-anchor="middle">competitions &amp; events</text>
    </g>
    <g class="in d4">
      <rect class="tile glow g4" x="685" y="1" width="213" height="128" rx="14"/>
      <text class="num" x="791" y="68" text-anchor="middle">3</text>
      <text class="lab" x="791" y="104" text-anchor="middle">projects</text>
    </g>
  </g>
</svg>
