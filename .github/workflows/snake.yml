# Generates the contribution "snake" animation used in README.md
# and pushes it to the `output` branch. Runs right after you upload files to main,
# then once a day; can also be started by hand (Actions tab -> Run workflow).
name: Generate snake animation

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFFFFF&color_dots=#161616,#3A3A3A,#6A6A6A,#A3A3A3,#E6E6E6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
